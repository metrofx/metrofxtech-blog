name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Link Vercel project
        run: npx vercel link --yes --token="${{ secrets.VERCEL_TOKEN }}" --scope=team_wSUVh0gHVZrFy3cQy6pNAXa0

      - name: Deploy to Vercel (Production)
        run: npx vercel deploy --prod --token="${{ secrets.VERCEL_TOKEN }}" --scope=team_wSUVh0gHVZrFy3cQy6pNAXa0
